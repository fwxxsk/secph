<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Looking for something?</title>

  <style>
    body{
      background:#0d1117;
      color:white;
      font-family:Arial;
      padding:40px;
      text-align:center;
    }

    .box{
      max-width:700px;
      margin:auto;
      background:#161b22;
      padding:25px;
      border-radius:15px;
      box-shadow:0 0 20px rgba(0,0,0,.5);
    }

    h1{
      color:#58a6ff;
    }

    .info{
      margin-top:20px;
      text-align:left;
      background:#0d1117;
      padding:15px;
      border-radius:10px;
    }

    p{
      line-height:1.7;
    }
  </style>
</head>
<body>

<div class="box">
  <h1>Nothing to see here</h1>

  <p>
    This page demonstrates how websites can see some information
    about visitors when they open links online.
  </p>

  <div class="info" id="info">
    Loading visitor information...
  </div>
</div>

<script>
async function loadInfo() {

  const ipData = await fetch("https://ipapi.co/json/")
    .then(res => res.json());

  const browser = navigator.userAgent;
  const platform = navigator.platform;
  const time = new Date().toString();

  document.getElementById("info").innerHTML = `
    <b>IP Address:</b> ${ipData.ip}<br><br>
    <b>City:</b> ${ipData.city}<br><br>
    <b>Region:</b> ${ipData.region}<br><br>
    <b>Country:</b> ${ipData.country_name}<br><br>
    <b>Device:</b> ${platform}<br><br>
    <b>Browser Info:</b><br>${browser}<br><br>
    <b>Time Opened:</b><br>${time}
  `;
}

loadInfo();
</script>

</body>
</html>
