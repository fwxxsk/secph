<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      color: white;
    }

    .card {
      text-align: center;
      padding: 30px;
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      width: 300px;
    }

    .profile-pic {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: #222;
      margin: 0 auto 15px auto;
      border: 2px solid #444;
    }

    .name {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .bio {
      font-size: 14px;
      opacity: 0.7;
      margin-bottom: 15px;
    }

    .dev-logo {
      font-size: 12px;
      opacity: 0.5;
      margin-top: 10px;
    }

    /* Quote animation */
    .quote {
      margin-top: 20px;
      font-size: 14px;
      letter-spacing: 2px;
      background: linear-gradient(90deg, black, white, black);
      background-size: 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: reveal 3s infinite linear;
    }

    @keyframes reveal {
      0% {
        background-position: 200%;
      }
      100% {
        background-position: 0%;
      }
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="profile-pic"></div>

    <div class="name">skye</div>

    <div class="bio">
      Short bio goes here.<br>
      Developer • Creator • Learner
    </div>

    <div class="dev-logo">
      ⚙ developer
    </div>

    <div class="quote">
      ganja.org :p
    </div>

  </div>

</body>
</html>
